<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Deposit and Withdrawal Currencies Management</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css" />
    <script src="/admin_i18n.js"></script>
    <style>
        .layui-card { margin-bottom: 15px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .tool-btn { margin-right: 5px; }
        .notice-banner { background-color: #e6f7ff; border-left: 4px solid #1890ff; padding: 12px 16px; border-radius: 4px; color: #002766; margin-bottom: 15px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
        .qr-thumb { max-width: 60px; max-height: 48px; border-radius: 4px; border: 1px solid #eee; cursor: pointer; }
    </style>
</head>
<body class="pear-container">
    
    <!-- Top Notice Bar -->
    <div class="layui-card">
        <div class="layui-card-body">
            <div class="notice-banner">
                <i class="layui-icon layui-icon-info" style="color: #1890ff; font-size: 18px;"></i>
                <span><b>Recharge & Payment Settings:</b> Update the wallet address and QR code image for each currency channel below. Changes take effect immediately in the user recharge view.</span>
            </div>
            
            <table id="data-table" lay-filter="data-table"></table>
        </div>
    </div>

    <!-- Toolbar Templates -->
    <script type="text/html" id="table-toolbar">
        <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> Add Payment Currency
        </button>
        <button class="pear-btn pear-btn-md" lay-event="refresh">
            <i class="layui-icon layui-icon-refresh"></i> Refresh List
        </button>
    </script>

    <script type="text/html" id="table-bar">
        <button class="pear-btn pear-btn-xs pear-btn-primary tool-btn" lay-event="edit">Edit Details</button>
        <button class="pear-btn pear-btn-xs pear-btn-danger tool-btn" lay-event="remove">Delete</button>
    </script>

    <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
    <script src="/app/admin/component/pear/pear.js"></script>
    
    <script>
        const PRIMARY_KEY = "id";
        const SELECT_API = "/admin/system/system-coin-channel/select";
        const UPDATE_API = "/admin/system/system-coin-channel/update";
        const DELETE_API = "/admin/system/system-coin-channel/delete";
        const INSERT_URL = "/admin/system/system-coin-channel/insert";
        const UPDATE_URL = "/admin/system/system-coin-channel/update";

        layui.use(["table", "form", "common", "popup", "util", "jquery"], function () {
            let table = layui.table;
            let form = layui.form;
            let $ = layui.$;
            let common = layui.common;
            let util = layui.util;

            let cols = [
                { type: "checkbox", align: "center" },
                { title: "ID", align: "center", field: "id", width: 70 },
                { title: "Currency / Network", align: "center", field: "name", minWidth: 160, templet: function(d) {
                    return '<b>' + util.escape(d.name || d.show_name || 'USDT') + '</b>';
                }},
                { title: "Wallet Address / Account", align: "center", field: "usercode", minWidth: 260, templet: function(d) {
                    let addr = d.usercode || 'Not configured';
                    return '<span style="font-family:monospace; color:#1890ff; font-weight:600;">' + util.escape(addr) + '</span>';
                }},
                { title: "QR Code Image", align: "center", field: "ewm", minWidth: 120, templet: function (d) {
                    if (!d.ewm) return '<span style="color:#ccc;">No QR Code</span>';
                    return '<img src="'+d.ewm+'" class="qr-thumb" onclick="layui.layer.photos({photos:{data:[{src:\''+d.ewm+'\'}]},anim:5})" />';
                }},
                { title: "Status", align: "center", field: "status", width: 110, templet: function (d) {
                    let checked = (d.status === 1 || d.recharge_is_show === 1) ? "checked" : "";
                    return '<input type="checkbox" value="' + d.id + '" lay-filter="status-switch" lay-skin="switch" lay-text="ACTIVE|OFF" ' + checked + '/>';
                }},
                { title: "Actions", toolbar: "#table-bar", align: "center", fixed: "right", width: 160 }
            ];

            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: true,
                cols: [cols],
                skin: "line",
                size: "lg",
                toolbar: "#table-toolbar",
                defaultToolbar: [{
                    title: "Refresh",
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"]
            });

            // Status switch change handler
            form.on("switch(status-switch)", function (data) {
                let load = layer.load();
                let postData = { id: this.value, status: data.elem.checked ? 1 : 0 };
                $.post(UPDATE_API, postData, function (res) {
                    layer.close(load);
                    if (res.code === 0) {
                        layui.popup.success("Status updated successfully");
                    } else {
                        layui.popup.failure(res.msg || "Update failed");
                        data.elem.checked = !data.elem.checked;
                        form.render();
                    }
                });
            });

            table.on("tool(data-table)", function (obj) {
                if (obj.event === "remove") {
                    remove(obj);
                } else if (obj.event === "edit") {
                    edit(obj);
                }
            });

            table.on("toolbar(data-table)", function (obj) {
                if (obj.event === "add") {
                    add();
                } else if (obj.event === "refresh") {
                    refreshTable();
                }
            });

            let add = function () {
                layer.open({
                    type: 2,
                    title: "Add Deposit Currency Channel",
                    shade: 0.1,
                    maxmin: true,
                    area: [common.isModile() ? "100%" : "600px", common.isModile() ? "100%" : "550px"],
                    content: INSERT_URL
                });
            }

            let edit = function (obj) {
                let value = obj.data[PRIMARY_KEY];
                layer.open({
                    type: 2,
                    title: "Edit Currency Wallet & QR Code",
                    shade: 0.1,
                    maxmin: true,
                    area: [common.isModile() ? "100%" : "600px", common.isModile() ? "100%" : "550px"],
                    content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
                });
            }

            let remove = function (obj) {
                layer.confirm("Are you sure you want to delete this payment channel?", {
                    icon: 3,
                    title: "Confirmation"
                }, function (index) {
                    layer.close(index);
                    let loading = layer.load();
                    $.post(DELETE_API, { id: obj.data[PRIMARY_KEY] }, function (res) {
                        layer.close(loading);
                        if (res.code === 0) {
                            layui.popup.success("Deleted successfully", refreshTable);
                        } else {
                            layui.popup.failure(res.msg || "Delete failed");
                        }
                    });
                });
            }

            window.refreshTable = function () {
                table.reloadData("data-table", { scrollPos: "fixed" });
            }
        });
    </script>
</body>
</html>
