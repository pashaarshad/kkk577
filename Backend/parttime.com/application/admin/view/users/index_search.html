<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label" style="background:#f8f9fa; color:#4e5969;">uid</label>
        <div class="layui-input-inline">
            <input name="id" value="{$Think.get.id|default=''}" placeholder="uid" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label" style="background:#f8f9fa; color:#4e5969;">account</label>
        <div class="layui-input-inline">
            <input name="tel" value="{$Think.get.tel|default=''}" placeholder="account" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label" style="background:#f8f9fa; color:#4e5969;">Invitation code</label>
        <div class="layui-input-inline">
            <input name="invite_code" value="{$Think.get.invite_code|default=''}" placeholder="Invitation code" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label" style="background:#f8f9fa; color:#4e5969;">Registration</label>
        <div class="layui-input-inline">
            <input data-date-range name="addtime" value="{$Think.get.addtime|default=''}" placeholder="Start time - End time" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn btn-op-blue" style="height:38px; line-height:38px; padding:0 20px;"><i class="layui-icon">&#xe615;</i> Query</button>
        <a href="{:url('index')}" class="layui-btn layui-btn-primary" style="height:38px; line-height:38px; padding:0 20px;">Reset</a>
        {if auth("daochu")}
        <a href="{:url('daochu')}" class="layui-btn btn-op-green" style="height:38px; line-height:38px; padding:0 20px;"><i class="layui-icon">&#xe601;</i> Export Membership</a>
        {/if}
    </div>
</form>

<!-- VIP Tier Filter Pills -->
<div class="vip-filter-pills" style="margin: 15px 0; display: flex; gap: 8px; flex-wrap: wrap;">
    <a href="{:url('index')}?level=-1" class="layui-btn layui-btn-sm {if $Think.get.level=='' || $Think.get.level=='-1'}layui-btn-normal{else}layui-btn-primary{/if}">All</a>
    {foreach $level_list as $vo}
    <a href="{:url('index')}?level={$vo.level}" class="layui-btn layui-btn-sm {if $Think.get.level==$vo.level}layui-btn-normal{else}layui-btn-primary{/if}">VIP{$vo.level}</a>
    {/foreach}
</div>
