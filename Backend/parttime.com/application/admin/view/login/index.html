{extend name="admin@index/index"}

{block name="body"}
<div class="login-container" data-supersized="__ROOT__/static/theme/img/login/bg1.jpg,__ROOT__/static/theme/img/login/bg2.jpg">
    <div class="header notselect layui-hide-xs">
        <a href="{:url('@')}" class="title">{:sysconf('app_name')}<span class="padding-left-5 font-s10">{:sysconf('app_version')}</span></a>
    </div>
    <form data-login-form onsubmit="return false" action="{:url('@admin/login/index')}" method="post" class="layui-anim layui-anim-upbit" autocomplete="off">
        <h2 class="notselect">System Management</h2>
        <ul>
            <li class="username">
                <label>
                    <i class="layui-icon layui-icon-username"></i>
                    <input class="layui-input" required name="username" autofocus autocomplete="off" placeholder="登录账号 / Username" title="请输入登录账号">
                </label>
            </li>
            <li class="password">
                <label>
                    <i class="layui-icon layui-icon-password"></i>
                    <input class="layui-input" required name="password" maxlength="32" type="password" autocomplete="off" placeholder="登录密码 / Password" title="请输入登录密码">
                </label>
            </li>
            <li class="verify">
                <label class="inline-block relative">
                    <i class="layui-icon layui-icon-picture-fine"></i>
                    <input class="layui-input" required name="verify" value="" maxlength="6" autocomplete="off" placeholder="验证码 / Captcha" title="请输入验证码">
                </label>
                <img data-refresh-captcha alt="img" src="{$captcha->getData()}" style="cursor:pointer;">
                <input type="hidden" name="uniqid" value="{$captcha->getUniqid()}">
            </li>
            <li class="text-center padding-top-20">
                <input type="hidden" name="_csrf_" value="{:systoken('index')}">
                <input type="hidden" name="skey" value="{$loginskey|default=''}">
                <button type="submit" class="layui-btn full-width" style="cursor:pointer; position:relative; z-index:10; font-size:16px; height:44px; line-height:44px;">Log in now</button>
            </li>
        </ul>
    </form>
    <div class="footer notselect">
        <p class="layui-hide-xs"><a target="_blank" href="https://www.google.cn/chrome">推荐使用谷歌浏览器</a></p>
        {:sysconf('site_copy')}
        {if sysconf('miitbeian')}<span class="padding-5">|</span><a target="_blank" href="http://beian.miit.gov.cn">{:sysconf('miitbeian')}</a>{/if}
    </div>
</div>
{/block}

{block name='style'}
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script>if (location.href.indexOf('#') > -1) location.replace(location.href.split('#')[0])</script>
<link rel="stylesheet" href="__ROOT__/static/theme/css/login.css">
{/block}

{block name='script'}
<script src="__ROOT__/static/plugs/supersized/supersized.3.2.7.min.js"></script>
{/block}
