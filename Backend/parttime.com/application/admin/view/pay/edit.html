{extend name='admin@main'}
{block name="content"}
<form onsubmit="return false;" id="PayForm" data-auto="true" method="post" class='layui-form layui-card' autocomplete="off">
    <div class="layui-card-body think-box-shadow padding-left-40">
        <div class="layui-form-item layui-row layui-col-space15">
            <label class="layui-col-xs9 relative">
                <span class="color-green font-w700">Payment Channel Name (e.g. UPI, USDT TRC20, Bank Pay)</span>
                <input name="name" required class="layui-input margin-top-5" placeholder="Enter channel name" value="{$info.name}">
                <input type="hidden" name="id" value="{$info.id}">
                <input type="hidden" name="_csrf_" value="{:systoken('edit')}">
            </label>
        </div>
        <div class="layui-form-item layui-row layui-col-space15">
            <label class="layui-col-xs9 relative">
                <span class="color-green font-w700">UPI ID / Wallet Address / Account Number</span>
                <input name="usercode" class="layui-input margin-top-5" placeholder="Enter UPI ID or Wallet Address" value="{$info.usercode}">
            </label>
        </div>
        <div class="layui-form-item layui-row layui-col-space15">
            <label class="layui-col-xs9 relative">
                <span class="color-green font-w700">Account Holder Name / UPI Name / Bank Name</span>
                <input name="username" class="layui-input margin-top-5" placeholder="Enter Account Holder Name" value="{$info.username}">
            </label>
        </div>
        <div class="layui-form-item block">
            <span class="label-required-prev color-green font-w700">Upload QR Code Image (For scanning and payment)</span>
            <p width="auto" class="text-left margin-top-5"><input name="ewm" type="hidden" value="{$info.ewm|default=''}"></p>
            <script>$('[name="ewm"]').uploadMultipleImage();</script>
            <p class="help-block margin-top-5">Upload or select QR code image for users to scan and pay</p>
        </div>
        <div class="layui-form-item layui-row layui-col-space15">
            <label class="layui-col-xs9 relative">
                <span class="color-green font-w700">Minimum Amount</span>
                <input name="min" required class="layui-input margin-top-5" placeholder="Minimum payment amount" value="{$info.min}">
            </label>
        </div>
        <div class="layui-form-item layui-row layui-col-space15">
            <label class="layui-col-xs9 relative">
                <span class="color-green font-w700">Maximum Amount</span>
                <input name="max" required class="layui-input margin-top-5" placeholder="Maximum payment amount" value="{$info.max}">
            </label>
        </div>
        <div class="layui-form-item layui-row layui-col-space15">
            <label class="layui-col-xs9 relative">
                <span class="color-green font-w700">Fee / Commission Rate</span>
                <input name="pay_commission" required class="layui-input margin-top-5" placeholder="Fee rate e.g. 0 for none" value="{$info.pay_commission}">
            </label>
        </div>
        <div class="layui-form-item text-center padding-top-20">
            <button class="layui-btn btn-op-blue" type="submit">Save Payment Method</button>
            <button class="layui-btn layui-btn-danger" ng-click="hsitoryBack()" type="button">Cancel</button>
        </div>
    </div>
</form>
{/block}
