<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>GOOD - Admin Login</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css" />
    <style>
        body {
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            width: 380px;
            padding: 35px 30px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }
        .login-header h2 {
            font-size: 22px;
            color: #333;
            margin: 0;
            font-weight: 600;
        }
        .login-btn {
            width: 100%;
            height: 44px;
            background-color: #B83A2E !important;
            border-color: #B83A2E !important;
            font-size: 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <img src="/app/admin/admin/images/logo.png" alt="Logo" onerror="this.src='/static/image/trc20-usdt.jpg'">
        <h2>GOOD</h2>
        <p style="color:#888; font-size:13px; margin-top:5px;">System Administrator Login</p>
    </div>

    <form class="layui-form" lay-filter="login-form" onsubmit="return false;">
        <div class="layui-form-item">
            <input type="text" name="username" value="admin123" required lay-verify="required" placeholder="Username / 账号" class="layui-input" style="height:44px;">
        </div>

        <div class="layui-form-item">
            <input type="password" name="password" value="123456a" required lay-verify="required" placeholder="Password / 密码" class="layui-input" style="height:44px;">
        </div>

        <div class="layui-form-item" style="margin-top:25px;">
            <button class="layui-btn pear-btn-primary login-btn" lay-submit lay-filter="login">Log In</button>
        </div>
    </form>
</div>

<script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
<script src="/app/admin/component/pear/pear.js"></script>
<script>
    layui.use(['form', 'popup', 'jquery'], function () {
        let form = layui.form;
        let popup = layui.popup;
        let $ = layui.$;

        form.on('submit(login)', function (data) {
            let load = layer.load();
            $.ajax({
                url: '/app/admin/account/login',
                type: 'POST',
                data: data.field,
                dataType: 'json',
                success: function (res) {
                    layer.close(load);
                    if (res.code === 0) {
                        popup.success('Login Successful!', function () {
                            location.href = '/owe9j2';
                        });
                    } else {
                        popup.failure(res.msg || 'Login failed');
                    }
                },
                error: function () {
                    layer.close(load);
                    popup.failure('Network error');
                }
            });
            return false;
        });
    });
</script>

</body>
</html>
