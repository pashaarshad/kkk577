<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Recharge Orders</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css"/>
    <style>
        .layui-table-cell {
            height: auto !important;
            line-height: 28px !important;
            padding: 8px 15px !important;
        }
        .order-money {
            font-weight: 700;
            color: #ff5722;
            font-size: 15px;
        }
        .channel-badge {
            background-color: #f0f5ff;
            color: #2f54eb;
            border: 1px solid #adc6ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .top-search-form .layui-form-item {
            margin-bottom: 0;
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>
<body class="pear-container">

<!-- 顶部查询表单 -->
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form top-search-form" lay-filter="search-table" onsubmit="return false;">
            <div class="layui-form-item">
                <label class="layui-form-label" style="width: auto;">Order No</label>
                <div class="layui-input-inline" style="width: 180px;">
                    <input type="text" name="order_no" placeholder="Order ID" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label" style="width: auto;">User / Phone</label>
                <div class="layui-input-inline" style="width: 160px;">
                    <input type="text" name="account" placeholder="Username / Phone / UID" autocomplete="off" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label" style="width: auto;">Status</label>
                <div class="layui-input-inline" style="width: 140px;">
                    <select name="status">
                        <option value="">All Statuses</option>
                        <option value="1">Pending / 待审核</option>
                        <option value="2">Approved / 已通过</option>
                        <option value="3">Rejected / 已驳回</option>
                    </select>
                </div>
            </div>

            <div class="layui-form-item" style="margin-left: 10px;">
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                    <i class="layui-icon layui-icon-search"></i> Search
                </button>
                <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                    <i class="layui-icon layui-icon-refresh"></i> Reset
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 数据表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table id="data-table" lay-filter="data-table"></table>
    </div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
    <button class="pear-btn pear-btn-success pear-btn-md" lay-event="batchApprove">
        <i class="layui-icon layui-icon-ok-circle"></i> Batch Approve (一键审核)
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchReject">
        <i class="layui-icon layui-icon-close-fill"></i> Batch Reject (一键驳回)
    </button>
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="refresh">
        <i class="layui-icon layui-icon-refresh"></i> Refresh
    </button>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
    {{# if (d.status == 1) { }}
        <button class="pear-btn pear-btn-xs pear-btn-success" lay-event="approve" title="Approve & Credit">
            <i class="layui-icon layui-icon-ok"></i> Approve
        </button>
        <button class="pear-btn pear-btn-xs pear-btn-danger" lay-event="reject" style="margin-left: 4px;" title="Reject Order">
            <i class="layui-icon layui-icon-close"></i> Reject
        </button>
    {{# } else if (d.status == 2) { }}
        <span class="layui-font-green" style="font-weight: 600;"><i class="layui-icon layui-icon-ok-circle"></i> Approved</span>
    {{# } else if (d.status == 3) { }}
        <span class="layui-font-gray" style="font-weight: 600;"><i class="layui-icon layui-icon-close-fill"></i> Rejected</span>
    {{# } else { }}
        <span>-</span>
    {{# } }}
</script>

<script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
<script src="/app/admin/component/pear/pear.js"></script>

<script>
layui.use(['table', 'form', 'popup', 'layer', 'jquery'], function () {
    const table = layui.table;
    const form = layui.form;
    const popup = layui.popup;
    const layer = layui.layer;
    const $ = layui.$;

    const SELECT_API = "/admin/bill/user-recharge/select";
    const APPROVE_API = "/admin/bill/user-recharge/check";
    const REJECT_API = "/admin/bill/user-recharge/ignore";

    table.render({
        elem: "#data-table",
        url: SELECT_API,
        page: true,
        skin: "line",
        size: "lg",
        toolbar: "#table-toolbar",
        defaultToolbar: ["filter", "exports", "print"],
        cols: [[
            { type: "checkbox", align: "center", width: 50 },
            { field: "order_no", title: "Order No / 订单号", minWidth: 180, align: "center" },
            {
                field: "user.account",
                title: "User Info / 用户信息",
                minWidth: 160,
                align: "left",
                templet: function (d) {
                    const acc = (d.user && d.user.account) ? d.user.account : (d.account || '-');
                    const tel = (d.user && d.user.tel) ? d.user.tel : '';
                    return '<div><strong>UID: ' + d.uid + '</strong><br><span style="color:#666;">' + acc + (tel && tel !== acc ? ' (' + tel + ')' : '') + '</span></div>';
                }
            },
            {
                field: "money",
                title: "Recharge Amount / 金额",
                minWidth: 130,
                align: "center",
                templet: function (d) {
                    return '<span class="order-money">+$' + parseFloat(d.money || 0).toFixed(2) + '</span>';
                }
            },
            {
                field: "channel",
                title: "Payment Channel / 支付通道",
                minWidth: 140,
                align: "center",
                templet: function (d) {
                    const ch = d.channel || d.pay_name || 'USDT';
                    return '<span class="channel-badge">' + ch + '</span>';
                }
            },
            {
                field: "pic",
                title: "Voucher / 凭据",
                minWidth: 100,
                align: "center",
                templet: function (d) {
                    if (d.pic && d.pic.trim() !== '' && !d.pic.includes('sample_voucher.png')) {
                        return '<img src="' + d.pic + '" style="max-width:36px;max-height:36px;border-radius:4px;cursor:pointer;" onclick="window.open('' + d.pic + '')" />';
                    }
                    return '<span style="color:#bbb;">None</span>';
                }
            },
            {
                field: "status",
                title: "Status / 状态",
                minWidth: 130,
                align: "center",
                templet: function (d) {
                    if (d.status == 1) {
                        return '<span class="layui-badge layui-bg-orange"><i class="layui-icon layui-icon-time"></i> Pending</span>';
                    } else if (d.status == 2) {
                        return '<span class="layui-badge layui-bg-green"><i class="layui-icon layui-icon-ok"></i> Approved</span>';
                    } else if (d.status == 3) {
                        return '<span class="layui-badge layui-bg-gray"><i class="layui-icon layui-icon-close"></i> Rejected</span>';
                    }
                    return '<span class="layui-badge layui-bg-gray">Unknown</span>';
                }
            },
            { field: "add_time", title: "Submit Time / 提交时间", minWidth: 160, align: "center" },
            {
                title: "Actions / 操作",
                toolbar: "#table-bar",
                align: "center",
                fixed: "right",
                minWidth: 170
            }
        ]]
    });

    table.on("tool(data-table)", function (obj) {
        const data = obj.data;
        if (obj.event === "approve") {
            layer.confirm("Confirm approval for Recharge Order <strong>" + data.order_no + "</strong>?<br>Amount <strong>$" + parseFloat(data.money).toFixed(2) + "</strong> will be credited to user balance.", {
                icon: 3,
                title: "Approve Recharge"
            }, function (index) {
                layer.close(index);
                const loadIdx = layer.load(2);
                $.ajax({
                    url: APPROVE_API,
                    type: "POST",
                    data: { ids: [data.id] },
                    dataType: "json",
                    success: function (res) {
                        layer.close(loadIdx);
                        if (res.code === 0) {
                            popup.success(res.msg || "Recharge approved successfully!", function () {
                                table.reload("data-table");
                            });
                        } else {
                            popup.failure(res.msg || "Operation failed");
                        }
                    },
                    error: function () {
                        layer.close(loadIdx);
                        popup.failure("Network error");
                    }
                });
            });
        } else if (obj.event === "reject") {
            layer.confirm("Confirm rejection for Recharge Order <strong>" + data.order_no + "</strong>?", {
                icon: 2,
                title: "Reject Recharge"
            }, function (index) {
                layer.close(index);
                const loadIdx = layer.load(2);
                $.ajax({
                    url: REJECT_API,
                    type: "POST",
                    data: { ids: [data.id] },
                    dataType: "json",
                    success: function (res) {
                        layer.close(loadIdx);
                        if (res.code === 0) {
                            popup.success(res.msg || "Recharge order rejected!", function () {
                                table.reload("data-table");
                            });
                        } else {
                            popup.failure(res.msg || "Operation failed");
                        }
                    },
                    error: function () {
                        layer.close(loadIdx);
                        popup.failure("Network error");
                    }
                });
            });
        }
    });

    table.on("toolbar(data-table)", function (obj) {
        const checkStatus = table.checkStatus("data-table");
        if (obj.event === "refresh") {
            table.reload("data-table");
        } else if (obj.event === "batchApprove") {
            if (checkStatus.data.length === 0) {
                return popup.warning("Please select at least one order.");
            }
            const ids = checkStatus.data.filter(d => d.status == 1).map(d => d.id);
            if (ids.length === 0) {
                return popup.warning("No pending orders among selected rows.");
            }
            layer.confirm("Confirm approval for <strong>" + ids.length + "</strong> pending recharge orders?", {
                icon: 3,
                title: "Batch Approve"
            }, function (index) {
                layer.close(index);
                const loadIdx = layer.load(2);
                $.ajax({
                    url: APPROVE_API,
                    type: "POST",
                    data: { ids: ids },
                    dataType: "json",
                    success: function (res) {
                        layer.close(loadIdx);
                        if (res.code === 0) {
                            popup.success(res.msg || "Orders approved successfully!", function () {
                                table.reload("data-table");
                            });
                        } else {
                            popup.failure(res.msg || "Operation failed");
                        }
                    },
                    error: function () {
                        layer.close(loadIdx);
                        popup.failure("Network error");
                    }
                });
            });
        } else if (obj.event === "batchReject") {
            if (checkStatus.data.length === 0) {
                return popup.warning("Please select at least one order.");
            }
            const ids = checkStatus.data.filter(d => d.status == 1).map(d => d.id);
            if (ids.length === 0) {
                return popup.warning("No pending orders among selected rows.");
            }
            layer.confirm("Confirm rejection for <strong>" + ids.length + "</strong> pending recharge orders?", {
                icon: 2,
                title: "Batch Reject"
            }, function (index) {
                layer.close(index);
                const loadIdx = layer.load(2);
                $.ajax({
                    url: REJECT_API,
                    type: "POST",
                    data: { ids: ids },
                    dataType: "json",
                    success: function (res) {
                        layer.close(loadIdx);
                        if (res.code === 0) {
                            popup.success(res.msg || "Orders rejected!", function () {
                                table.reload("data-table");
                            });
                        } else {
                            popup.failure(res.msg || "Operation failed");
                        }
                    },
                    error: function () {
                        layer.close(loadIdx);
                        popup.failure("Network error");
                    }
                });
            });
        }
    });

    form.on("submit(table-query)", function (data) {
        table.reload("data-table", {
            page: { curr: 1 },
            where: data.field
        });
        return false;
    });

    form.on("submit(table-reset)", function () {
        table.reload("data-table", {
            page: { curr: 1 },
            where: {}
        });
        return false;
    });
});
</script>

</body>
</html>
