<div class="modal fade" id="notice_modal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
        <div class="modal-content">
            <button type="button" class="close close-rounded noticePopClose" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">×</span></button>
            <div class="modal-header border-0"
                 style="height: 100px;background: url(/red/tanchuang_header.png); background-size: cover;"></div>
            <div class="modal-body text-center pt-4" style="max-height: 300px; overflow: scroll">
                {$user_notice|RAW}
            </div>
            <div class="modal-footer border-0">
                <button type="button"
                        class="btn btn-default btn-lg btn-rounded shadow btn-block btn-important noticePopOk"
                        data-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>
<script>
    $(function () {
        var show_user_notice = {$show_user_notice};
        if (show_user_notice) {
            $('#notice_modal').modal('show');
        }
        
        $('.noticePopClose').click(function () {
            $('#notice_modal').modal('hide');
        });
        $('.noticePopOk').click(function () {
            $.ajax({
                url: "/index/my/read_notice.html",
                type: 'POST',
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    
                },
                success: function (data) {
                    
                }
            });
        });
    }); 
</script>
