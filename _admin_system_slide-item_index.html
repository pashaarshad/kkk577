<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Poster Banners Management</title>
        <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
        <link rel="stylesheet" href="/app/admin/admin/css/reset.css" />
        <script src="/admin_i18n.js"></script>
    </head>
    <body class="pear-container">
    
        <!-- Search Bar -->
        <div class="layui-card">
            <div class="layui-card-body">
                <form class="layui-form top-search-from">
                    <div class="layui-form-item layui-inline">
                        <label class="layui-form-label">Title</label>
                        <div class="layui-input-inline">
                            <input type="text" autocomplete="off" name="title" placeholder="Search title..." class="layui-input">
                        </div>
                    </div>
                    
                    <div class="layui-form-item layui-inline">
                        <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                            <i class="layui-icon layui-icon-search"></i> Search
                        </button>
                        <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                            <i class="layui-icon layui-icon-refresh"></i> Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Table -->
        <div class="layui-card">
            <div class="layui-card-body">
                <table id="data-table" lay-filter="data-table"></table>
            </div>
        </div>

        <!-- Toolbar Templates -->
        <script type="text/html" id="table-toolbar">
            <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
                <i class="layui-icon layui-icon-add-1"></i> New Banner
            </button>
            <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove">
                <i class="layui-icon layui-icon-delete"></i> Delete Selected
            </button>
        </script>

        <script type="text/html" id="table-bar">
            <button class="pear-btn pear-btn-xs pear-btn-primary tool-btn" lay-event="edit">Edit</button>
            <button class="pear-btn pear-btn-xs pear-btn-danger tool-btn" lay-event="remove">Delete</button>
        </script>

        <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
        <script src="/app/admin/component/pear/pear.js"></script>
        <script src="/app/admin/admin/js/common.js"></script>
        
        <script>
            const PRIMARY_KEY = "id";
            const SELECT_API = "/admin/system/slide-item/select";
            const UPDATE_API = "/admin/system/slide-item/update";
            const DELETE_API = "/admin/system/slide-item/delete";
            const INSERT_URL = "/admin/system/slide-item/insert";
            const UPDATE_URL = "/admin/system/slide-item/update";
            
            layui.use(["table", "form", "common", "popup", "util", "jquery"], function() {
                let table = layui.table;
                let form = layui.form;
                let $ = layui.$;
                let common = layui.common;
                let util = layui.util;
                
                let cols = [
                    { type: "checkbox", align: "center" },
                    { title: "ID", align: "center", field: "id", width: 70 },
                    { title: "Banner Name", align: "center", field: "title", minWidth: 150 },
                    { title: "Image", align: "center", field: "image", minWidth: 140, templet: function (d) {
                        if (!d.image) return '<span style="color:#ccc;">No Image</span>';
                        return '<img src="'+d.image+'" style="max-width:120px; max-height:48px; border-radius:4px; cursor:pointer;" onclick="layui.layer.photos({photos:{data:[{src:\''+d.image+'\'}]},anim:5})" />';
                    }},
                    { title: "Target URL", align: "center", field: "url", minWidth: 120 },
                    { title: "Status", align: "center", field: "status", width: 100, templet: function (d) {
                        let checked = d.status == 1 ? "checked" : "";
                        return '<input type="checkbox" value="'+d.id+'" lay-filter="status-switch" lay-skin="switch" lay-text="ON|OFF" '+checked+'/>';
                    }},
                    { title: "Add Time", align: "center", field: "add_time", width: 170 },
                    { title: "Actions", toolbar: "#table-bar", align: "center", fixed: "right", width: 140 }
                ];
                
                table.render({
                    elem: "#data-table",
                    url: SELECT_API,
                    page: true,
                    cols: [cols],
                    skin: "line",
                    size: "lg",
                    toolbar: "#table-toolbar",
                    defaultToolbar: [{
                        title: "Refresh",
                        layEvent: "refresh",
                        icon: "layui-icon-refresh",
                    }, "filter", "print", "exports"]
                });

                // Status Switch Change Event Handler
                form.on("switch(status-switch)", function (data) {
                    let load = layer.load();
                    let postData = { id: this.value, status: data.elem.checked ? 1 : 0 };
                    $.post(UPDATE_API, postData, function (res) {
                        layer.close(load);
                        if (res.code === 0) {
                            layui.popup.success("Status updated successfully");
                        } else {
                            layui.popup.failure(res.msg || "Update failed");
                            data.elem.checked = !data.elem.checked;
                            form.render();
                        }
                    });
                });
                
                table.on("tool(data-table)", function(obj) {
                    if (obj.event === "remove") {
                        remove(obj);
                    } else if (obj.event === "edit") {
                        edit(obj);
                    }
                });

                table.on("toolbar(data-table)", function(obj) {
                    if (obj.event === "add") {
                        add();
                    } else if (obj.event === "refresh") {
                        refreshTable();
                    } else if (obj.event === "batchRemove") {
                        batchRemove(obj);
                    }
                });

                form.on("submit(table-query)", function(data) {
                    table.reload("data-table", {
                        page: { curr: 1 },
                        where: data.field
                    });
                    return false;
                });
                
                form.on("submit(table-reset)", function(data) {
                    table.reload("data-table", { where: [] });
                });

                let add = function () {
                    layer.open({
                        type: 2,
                        title: "New Poster Banner",
                        shade: 0.1,
                        moveOut: true,
                        maxmin: true,
                        area: [common.isModile() ? "100%" : "550px", common.isModile() ? "100%" : "480px"],
                        content: INSERT_URL
                    });
                }

                let edit = function (obj) {
                    let value = obj.data[PRIMARY_KEY];
                    layer.open({
                        type: 2,
                        title: "Edit Poster Banner",
                        shade: 0.1,
                        moveOut: true,
                        maxmin: true,
                        area: [common.isModile() ? "100%" : "550px", common.isModile() ? "100%" : "480px"],
                        content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
                    });
                }

                let remove = function (obj) {
                    layer.confirm("Are you sure you want to delete this banner?", {
                        icon: 3,
                        title: "Confirmation"
                    }, function(index) {
                        layer.close(index);
                        let loading = layer.load();
                        $.ajax({
                            url: DELETE_API,
                            data: { id: obj.data[PRIMARY_KEY] },
                            dataType: "json",
                            type: "post",
                            success: function(res) {
                                layer.close(loading);
                                if (res.code === 0) {
                                    layui.popup.success("Deleted successfully", refreshTable);
                                } else {
                                    layui.popup.failure(res.msg || "Delete failed");
                                }
                            }
                        });
                    });
                }

                let batchRemove = function (obj) {
                    let checkIds = common.checkField(obj, PRIMARY_KEY);
                    if (checkIds === "") {
                        layui.popup.warning("No item selected");
                        return false;
                    }
                    layer.confirm("Are you sure you want to delete selected banners?", {
                        icon: 3,
                        title: "Confirmation"
                    }, function(index) {
                        layer.close(index);
                        let loading = layer.load();
                        $.ajax({
                            url: DELETE_API,
                            data: { ids: checkIds },
                            dataType: "json",
                            type: "post",
                            success: function(res) {
                                layer.close(loading);
                                if (res.code === 0) {
                                    layui.popup.success("Deleted successfully", refreshTable);
                                } else {
                                    layui.popup.failure(res.msg || "Delete failed");
                                }
                            }
                        });
                    });
                }

                window.refreshTable = function() {
                    table.reloadData("data-table", { scrollPos: "fixed" });
                }
            });
        </script>
    </body>
</html>
