    <link rel="stylesheet" href="/app/admin/admin/css/reset.css"/>

<body class="pear-container">

    <div class="layui-card-body">
        <form class="layui-form top-search-from">
            <div class="layui-form-item">
                <label class="layui-form-label">用户</label>
                <div class="layui-input-block">
                    <div name="uid" id="uid" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">等级</label>
                <div class="layui-input-block">
                    <input type="number" name="level" value="" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">商品</label>
                <div class="layui-input-block">
                    <div name="product_id" id="product_id" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <div name="status" id="status" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">添加时间</label>
                <div class="layui-input-block">
                    <div class="layui-input-block" id="add_time">
                        <input type="text" autocomplete="off" name="add_time[]" id="add_time-date-start"
                               class="layui-input inline-block" placeholder="开始时间">
                        -
                        <input type="text" autocomplete="off" name="add_time[]" id="add_time-date-end"
                               class="layui-input inline-block" placeholder="结束时间">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">完成时间</label>
                <div class="layui-input-block">
                    <div class="layui-input-block" id="finish_time">
                        <input type="text" autocomplete="off" name="finish_time[]" id="finish_time-date-start"
                               class="layui-input inline-block" placeholder="开始时间">
                        -
                        <input type="text" autocomplete="off" name="finish_time[]" id="finish_time-date-end"
                               class="layui-input inline-block" placeholder="结束时间">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">任务类型</label>
                <div class="layui-input-block">
                    <div name="task_type" id="task_type" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">派单类型</label>
                <div class="layui-input-block">
                    <div name="send_record" id="send_record" value=""></div>
                </div>
            </div>

            <div class="layui-form-item layui-inline">
                <label class="layui-form-label"></label>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                    <i class="layui-icon layui-icon-search"></i>查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                    <i class="layui-icon layui-icon-refresh"></i>重置
                </button>
            </div>
            <div class="toggle-btn">
                <a class="layui-hide">展开<i class="layui-icon layui-icon-down"></i></a>
                <a class="layui-hide">收起<i class="layui-icon layui-icon-up"></i></a>
            </div>
        </form>
    </div>
</div>

<!-- 数据表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table id="data-table" lay-filter="data-table"></table>
    </div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="admin.bill.taskrecord.add">
        <i class="layui-icon layui-icon-add-1"></i>批量派单
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="cancel"
            permission="admin.bill.taskrecord.cancel">
        <i class="layui-icon layui-icon-delete"></i>批量取消
    </button>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">

    </button>
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="admin.bill.taskrecord.delete">删除

</script>

    // 字段 用户uid uid
    layui.use(["jquery", "xmSelect", "popup"], function () {
        let value = layui.$("#uid").attr("value");
        let initValue = value ? value.split(",") : [];
        layui.xmSelect.render({
            el: "#uid",
            name: "uid",
            initValue: initValue,
            filterable: true,
            model: {"icon": "hidden", "label": {"type": "text"}},
            clickClose: true,
            radio: true,
            paging: true,
            pageRemote: true,
            pageSize: 10,
            prop: {
                name: 'account',
                value: 'uid',
            },
            remoteMethod: function (val, cb, show, pageIndex) {
                layui.$.ajax({
                    url: "/admin/member/user/selectData",
                    data: {
                        account: {0: 'like', 1: val},
                        page: pageIndex,
                        limit: 10,
                    },
                    success: function (response) {
                        let res = response.data;
                        //回调需要两个参数, 第一个: 数据数组, 第二个: 总页码
                        let count = Math.ceil(response.count / 10);
                        cb(res, count)
                    }
                });
            },
        });
    });

    // 字段 商品id product_id
    layui.use(["jquery", "xmSelect", "popup"], function () {
        let value = layui.$("#product_id").attr("value");
        let initValue = value ? value.split(",") : [];
        layui.xmSelect.render({

            paging: true,
            pageRemote: true,
            pageSize: 10,
            prop: {
                name: 'store_name',

            remoteMethod: function (val, cb, show, pageIndex) {
                layui.$.ajax({
                    url: "/admin/system/product/select",
                    data: {
                        product_name: {0: 'like', 1: val},

                        limit: 10,

                    success: function (response) {
                        let res = response.data;
                        //回调需要两个参数, 第一个: 数据数组, 第二个: 总页码
                        let count = Math.ceil(response.count / 10);
                        cb(res, count)
                    }
                });
            },

    });

                    });

                    title: "刷新",
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                done: function () {
                    layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                }
            });
        }

        apiResults["send_record"] = {"1": "自动派单", "2": "手动派单"};
        let count = apis.length;
        layui.each(apis, function (k, item) {
            let [field, url] = item;
            $.ajax({
                url: url,
                dateType: "json",
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(res.msg);
                    }

                    function travel(items) {
                        for (let k in items) {
                            let item = items[k];
                            apiResults[field][item.value] = item.name;
                            if (item.children) {
                                travel(item.children);
                            }
                        }
                    }

                    travel(res.data);
                },
                complete: function () {
                    if (--count === 0) {
                        render();
                    }
                }
            });
        });
        if (!count) {
            render();
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: "修改",
                shade: 0.1,
                maxmin: true,
                area: [common.isModile() ? "100%" : "500px", common.isModile() ? "100%" : "450px"],
                content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let batchCancel = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning("未选中数据");
                return false;
            }
            let data = {};
            data[PRIMARY_KEY] = checkIds.split(",");
            layer.confirm("该操作将勾选的任务一键取消，请谨慎操作！", {
                icon: 3,
                title: "提示"
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: CANCEL_URL,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(res.msg);
                        }
                        return layui.popup.success("操作成功", refreshTable);
                    }
                })
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning("未选中数据");
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm("确定删除?", {
                icon: 3,
                title: "提示"
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(res.msg);
                        }
                        return layui.popup.success("操作成功", refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function (param) {
            table.reloadData("data-table", {
                scrollPos: "fixed"
            });
        }
        $('body').on('click', '[data-table-info]', function () {
            let uid = $(this).attr('data-table-info')
            layer.open({
                type: 2,
                title: "详情",
                shade: 0.1,
                maxmin: true,
                area: [common.isModile() ? "100%" : "100%", common.isModile() ? "100%" : "100%"],
                content: '/admin/member/user/edit' + "?uid=" + uid
            });
        });
    })

</script>
</body>
</html>
