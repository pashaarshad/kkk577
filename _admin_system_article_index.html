<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const SELECT_API = "/admin/system/article/select";
    const TRANSLATE_URL = "/admin/system/notice-template/translate";
    const UPDATE_API = "/admin/system/article/update";
    const DELETE_API = "/admin/system/article/delete";
    const INSERT_URL = "/admin/system/article/insert";
    const UPDATE_URL = "/admin/system/article/update";

    layui.use(["form", "util", "popup", "tinymce", "loading"], function () {
        let $ = layui.$;
        let tinymce = layui.tinymce;
        let loading = layui.loading;

        /*
        {
            'en':{
                isEditing:false,
                content:'',
                editInstance:null
            }
        } */
        // 译文数据实例等对象
        let translateData = {}

        // 实例数组
        let edit_map = [];

        function cleanStyles(code) {
            if (code) {
                code = code.replace(/ style="[^"]+"/ig, '').replace(/ class="[^"]+"/ig, '');
                //if (document.getElementById('clearLink').checked) {
                code = code.replace(/\<a [^\>]+\>/ig, '').replace(/\<\/a>/ig, '');
                //}
            }
            return code;
        }
        function addEditor(selector) {
            // 检查是否已经是TinyMCE实例
            if (!edit_map[selector]) {
                //tinymce.init({selector: '#' + selector});
                edit_map[selector] = tinymce.render({
                    elem: "#" + selector,
                    height: 300,
                    resize:true,
                    convert_urls: false,
                    paste_preprocess: function (plugin, args) {
                        // 如果是第一次粘贴，清理样式
                        args.content = cleanStyles(args.content);
                    },
                    'images_upload_url': "/app/admin/upload/image",
                });
                edit_map[selector].on("blur", function () {
                    layui.$("#" + selector).val(edit_map[selector].getContent());
                });
            }
            return edit_map[selector]
        }

        addEditor('original_text');

        // 获取译文数据
        $.ajax({
            url: SELECT_API + '?type=' + $('#type').val(),
            dataType: "json",
            async: false,
            success: function (res) {
                // 给表单初始化数据
                layui.each(res.data, function (key, value) {
                    $('#html_' + value.lang).html(value.content)

                    if (!translateData[value.lang]) {
                        translateData[value.lang] = {
                            isEditing: false,
                            content: value.content,
                            editInstance: null
                        }
                    } else {
                        translateData[value.lang] = {
                            isEditing: false,
                            content: value.content,
                            editInstance: null
                        }
                    }
                });
                // ajax返回失败
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });


        $('#translate').click(function () {
            // 点击事件触发的代码
            let content = edit_map['original_text'].getContent();
            let par = {
                remarks: content,
            };
            loading.Load(4, '翻译中');
            $.ajax({
                url: TRANSLATE_URL, // url---->地址
                type: "POST", // type ---> 请求方式
                async: true, // async----> 同步：false，异步：true
                data: par,
                success: function (result) {
                    if (result.code == 1) {
                        layui.popup.success(result.msg);

                        $.each(result.data, function (key, value) {
                            if (translateData[key]) {
                                const currnetInstance = translateData[key]
                                translateData[key].content = value

                                if (currnetInstance.isEditing && currnetInstance.editInstance) {
                                    currnetInstance.editInstance.setContent(value)
                                } else {
                                    $('#html_' + key).html(value)
                                }
                            }
                        });
                    } else {
                        layui.popup.failure(result.msg);
                    }
                    loading.loadRemove(1000);
                }
            });
        });

        function countWithChineseAsTwo(str) {
            return str.length;
        }
        $('#translate2').click(function () {
            // 点击事件触发的代码
            let content = edit_map['original_text'].getContent();
            let par = {
                remarks: content,
                type: 'html',
                channel:'2',
            };
            let length = countWithChineseAsTwo(content);
            layer.confirm("收费翻译将会根据字符数量扣除对应积分,每100万字符30积分，本次翻译一个语言预估"+length+"字符，确定使用收费翻译吗？", {
                icon: 3,
                title: "提示"
            }, function (index) {
                layer.close(index);
                loading.Load(4, '翻译中');
                $.ajax({
                    url: TRANSLATE_URL, // url---->地址
                    type: "POST", // type ---> 请求方式
                    async: true, // async----> 同步：false，异步：true
                    data: par,
                    success: function (result) {
                        if (result.code == 1) {
                            layui.popup.success(result.msg);
                            $.each(result.data, function (key, value) {
                                if (translateData[key]) {
                                    const currnetInstance = translateData[key]
                                    translateData[key].content = value

                                    if (currnetInstance.isEditing && currnetInstance.editInstance) {
                                        currnetInstance.editInstance.setContent(value)
                                    } else {
                                        $('#html_' + key).html(value)
                                    }
                                }
                            });
                        } else {
                            layui.popup.failure(result.msg);
                        }
                        loading.loadRemove(1000);
                    }
                });
            });
        });

        // 编辑按钮点击事件
        $('.edit-btn').click(function () {
            const target = $(this).data('target');

            // 编辑器状态
            if (translateData[target].isEditing) {
                $(`#edit_${target}`).text('编辑')

                translateData[target].content = translateData[target].editInstance.getContent()

                translateData[target].editInstance.hide()


                $(`#html_${target}`).html(translateData[target].content)

                translateData[target].isEditing = false

            }
            // 富文本渲染状态
            else {
                $(`#edit_${target}`).text('完成')

                translateData[target].isEditing = true
                if (translateData[target].editInstance) {
                    translateData[target].editInstance.show()
                } else {
                    tinymce.init({
                        selector: `#html_${target}`,
                        'images_upload_url': "/app/admin/upload/image",
                        height: 300,
                        resize:true,
                        setup: function (editor) {
                            editor.on('init', function () {
                                editor.setContent(translateData[target].content);
                            });
                            editor.on('show', function () {
                                editor.setContent(translateData[target].content)
                            })
                        }
                    });
                    translateData[target].editInstance = tinymce.get(`#html_${target}`)
                }
            }
        });

        layui.form.on("submit(save)", function (data) {
            //data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            let params = {
                original_text: edit_map['original_text'].getContent(),
                type: $(`#type`).val()
            }

            $.each(translateData, function (key, value) {
                const currnetInstance = translateData[key]
                if (currnetInstance.isEditing) {
                    params[key] = currnetInstance.editInstance.getContent()
                } else {
                    params[key] = currnetInstance.content
                }
            });

            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: params,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(res.msg);
                    }
                    return layui.popup.success("操作成功", function () {
                        location.reload();
                        //refreshTable();
                        //parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });

        // 监听页面刷新或关闭事件
        window.addEventListener('beforeunload', function (event) {
            // 销毁所有TinyMCE实例
            edit_map.forEach(function (editor) {
                editor.remove();
            });

            $.each(translateData, function (key, value) {
                const currnetInstance = translateData[key]
                if (currnetInstance.editInstance) {
                    currnetInstance.editInstance.remove()
                }
            });
        });
    });
    // 表格渲染

</script>
</body>

</html>
