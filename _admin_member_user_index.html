    .layui-table-cell {

    }

    /* 顶部工具栏按钮自适应 */
    .layui-table-tool-temp {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 4px !important;
        align-items: center;
    }
    .layui-table-tool-temp button {
        float: none !important;
        margin: 0 !important;
    }

    /* 行操作按钮容器 */
    .table-bar-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 3px;
        justify-content: center;
        align-items: center;
        padding: 4px 0;
    }

    @media screen and (max-width: 768px) {
        .layui-table-tool-temp {
            gap: 3px !important;
        }
        .layui-table-tool-temp button {
            font-size: 12px !important;
            padding: 0 6px !important;
            height: 26px !important;
            line-height: 26px !important;
        }

        .table-bar-wrap {
            gap: 3px 2px;
        }
        .table-bar-wrap .pear-btn {
            padding: 0 5px !important;
            height: 24px !important;
            line-height: 24px !important;
            font-size: 11px !important;
        }

        .layui-table-cell {
            height: auto !important;
            line-height: 24px !important;
        }
        .layui-table-cell li {
            font-size: 12px;
            line-height: 1.5;
            white-space: nowrap;

    }

<script>

    // 相关常量
    const PRIMARY_KEY = "uid";

    const UPDATE_API = "/admin/member/user/update";
    const DELETE_API = "/admin/member/user/delete";
    const INSERT_URL = "/admin/member/user/insert";
    const UPDATE_URL = "/admin/member/user/update";
    const EDIT_URL = "/admin/member/user/edit";
    const QUERY_BALANCE_URL = "/admin/member/user/queryBalance";
    const BATCH_URL = "/admin/member/user/batch";
    const EXPORT_URL = "/admin/member/user/export";
    const BATCH_BAN_URL = "/admin/member/user/batchBan";
    const CLEAR_URL = "/admin/member/user/clearData";
    const QUERY_TRX_URL = '/admin/member/user/inquiryT';
    const QUERY_USDT_URL = '/admin/member/user/inquiryU';
    const QUERY_RECHARGE_URL = '/admin/member/user/queryRecharge';
    const EDIT_IS_SCORE_RECHARGE = '/admin/member/user/isScore';
    const EDIT_MONEY_URL = '/admin/member/user/modifymoney';
    const FORCE_OFFLINE_RECHARGE = '/admin/member/user/forceOffline';
    const SUBORDINATE_RECHARGE_URL = '/admin/member/user/subordinateRecharge';
    const JUNIOR_URL = '/admin/member/user/junior';
    const SUPERIOR_URL = '/admin/member/user/superior';//上级
    const SIMULATE_URL = '/admin/member/user/simulate';//模拟登录
    const BATCH_CATE_URL = '/admin/member/user/batchCate';//批量设置分组
    const SYSTEM_PLAY_TYPE = "1";
    const SKIN_NO = "32";
    layui.use(["jquery", "xmSelect"], function () {
        let cate_url = '/admin/member/UserCate/select?page=1&limit=9999';
        layui.$.ajax({
            url: cate_url,
            dataType: "json",
            success: function (res) {
                let value = layui.$("#cate_id").attr("value");
                let initValue = value ? value.split(",") : [];
                let cateData = res.data || [];
                cateData.unshift({id: 0, cate_name: '未分组'});
                xmSelect.render({
                    el: "#cate_id",
                    name: "cate_id",
                    initValue: initValue,
                    filterable: true,
                    data: cateData,
                    prop: {
                        name: 'cate_name',
                        value: 'id',
                    },
                    //model: {"icon":"hidden","label":{"type":"text"}},
                    //clickClose: true,
                    radio: true,
                });
            }
        });
    })

    layui.use(['form', 'table', 'element'], function () {
        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            element = layui.element
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        //监听Tab切换，以改变地址hash值
        element.on('tab(docMemberTab)', function () {
            var level = this.getAttribute('lay-level');
            $("#now_select_level").val(level);//保存一下当前的leve
            var formData = form.val('search-table');// l
            formData['levels'] = level;
            table.reload('data-table', {
                method: 'get'
                , where: formData
                , page: {
                    curr: 1
                }
            });
        });
    });
    // 字段 添加时间 add_time
    layui.use(["laydate"], function () {
        layui.laydate.render({
            elem: "#add_time",
            range: ["#add_time-date-start", "#add_time-date-end"],
            type: 'datetime',
            rangeLinked: true
        });
    })

                        $($(".layui-table-fixed-r .layui-table-body tbody tr")[index]).height($(val).height());

        function bindSwitchEvent(field) {
            form.on("switch(" + field + ")", function (data) {
                // 保存当前开关状态
                let currentState = data.elem.checked;
                // 弹出确认提示
                layer.confirm("确定执行此操作吗？", {icon: 3, title: "提示"}, function (index) {
                    layer.close(index);
                    let load = layer.load();
                    let postData = {
                        [field]: currentState ? 1 : 0,
                        [PRIMARY_KEY]: data.elem.value
                    };

                    $.post(UPDATE_API, postData, function (res) {
                        layer.close(load);
                        if (res.code) {
                            return layui.popup.failure(res.msg, function () {
                                // 操作失败，回滚开关状态
                                data.elem.checked = !currentState;
                                form.render();
                            });
                        }
                        return layui.popup.success("操作成功");
                    });
                }, function () {
                    // 取消操作，回滚开关状态
                    data.elem.checked = !currentState;
                    form.render();
                });
            });
        }

// 生成开关 HTML
        function generateSwitchHtml(d, fields) {
            return fields.map(({field, text, title}) => {
                let checked = d[field] === 1 ? "checked" : "";
                bindSwitchEvent(field);
                return `<li title="${util.escape(title)}">
            <span>${util.escape(title)}：</span>
            <input type="checkbox" value="${util.escape(d[PRIMARY_KEY])}"
                lay-filter="${util.escape(field)}"
                lay-skin="switch"
                lay-text="${util.escape(text)}"
                ${checked}/>
        </li>`;
            }).join('');

        //apis.push(["language", "/admin/system/lang-type/select?format=select"]);

        let apiResults = {};
        apiResults["add_ip_area"] = [];
        apiResults["last_ip_area"] = [];
        apiResults["language"] = [];
        apiResults["one_spread_uid"] = [];
        apiResults["user_type"] = {"1": "邮箱注册", "2": "手机号注册"};
        apiResults["recharge_type"] = {"1": "基础账户", "2": "理财账户"};

                url: url,
                dateType: "json",
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(res.msg);
                    }

                    function travel(items) {
                        for (let k in items) {
                            let item = items[k];
                            apiResults[field][item.value] = item.name;
                            if (item.children) {
                                travel(item.children);
                            }
                        }
                    }

                    travel(res.data);
                },
                complete: function () {
                    if (--count === 0) {
                        render();
                    }
                }
            });
        });
